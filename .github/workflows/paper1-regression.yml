name: Paper 1 simulator regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pilot-a3b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run transferred simulator and evolutionary-controller tests
        working-directory: experiments/pilot_a3b
        run: |
          python -m pytest -q \
            test_a3_labels.py \
            test_d079_diagnostics.py \
            test_d079_manifest_lock.py \
            test_formal_scenario_generator.py \
            test_fspae_runner.py \
            test_recoverability.py \
            test_sbcg.py \
            test_sbcg_runner.py \
            test_task_semantics.py
      - name: Run D-079 Train-only FSPAE exploratory pilot
        working-directory: experiments/pilot_a3b
        timeout-minutes: 20
        run: |
          python run_fspae_pilot.py --output-dir "$RUNNER_TEMP/d079-fspae"
          cat "$RUNNER_TEMP/d079-fspae/d079_fspae_pilot.md"
      - name: Upload D-079 Train-only FSPAE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d079-fspae-train-only-${{ github.sha }}
          path: ${{ runner.temp }}/d079-fspae/
          if-no-files-found: warn
          retention-days: 30
      - name: Run FSPAE-R2 target-conditioned development experiment
        working-directory: experiments/pilot_a3b
        timeout-minutes: 20
        run: |
          python run_fspae_r2_development.py --output-dir "$RUNNER_TEMP/d079-fspae-r2"
          cat "$RUNNER_TEMP/d079-fspae-r2/d079_fspae_r2_development.md"
      - name: Upload FSPAE-R2 development results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d079-fspae-r2-development-${{ github.sha }}
          path: ${{ runner.temp }}/d079-fspae-r2/
          if-no-files-found: warn
          retention-days: 30

      - name: Build split-preserving legacy tau-bench Retail dataset
        run: |
          python scripts/prepare_tau_bench_retail.py --output-dir "$RUNNER_TEMP/tau-bench-retail"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "tau-bench-retail", "integrity_report.json")
          report = json.load(open(path, encoding="utf-8"))
          gold = report["gold_action_audit"]
          print(json.dumps({
              "gate": report["gate"],
              "source_integrity_gate": report["source_integrity_gate"],
              "gold_action_gate": report["gold_action_gate"],
              "splits": report["splits"],
              "database": report["database"],
              "cross_split_exact_duplicate_fingerprint_groups": report["cross_split_exact_duplicate_fingerprint_groups"],
              "cross_split_instruction_duplicate_groups": report["cross_split_instruction_duplicate_groups"],
              "within_split_exact_duplicate_task_counts": report["within_split_exact_duplicate_task_counts"],
              "task_user_reference_failure_count": report["task_user_reference_failure_count"],
              "domain_error_count": gold["domain_error_count"],
              "domain_error_task_count": gold["domain_error_task_count"],
              "domain_error_counts_by_split": gold["domain_error_counts_by_split"],
              "domain_error_counts_by_tool": gold["domain_error_counts_by_tool"],
              "domain_error_counts_by_message": gold["domain_error_counts_by_message"],
              "domain_error_examples": gold["domain_errors"],
              "warnings": report["warnings"],
              "invocation_errors": gold["invocation_errors"],
              "signature_errors": gold["signature_errors"],
              "failures": report["failures"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Audit official tau-bench and EvoTool adapter conformance
        run: |
          python scripts/audit_evotool_tau_bench_conformance.py --dataset-dir "$RUNNER_TEMP/tau-bench-retail"
          cat "$RUNNER_TEMP/tau-bench-retail/evotool_tau_bench_conformance.md"
      - name: Run deterministic T1/T3 treatment audit (Train only)
        run: |
          python scripts/audit_evotool_treatments.py --dataset-dir "$RUNNER_TEMP/tau-bench-retail"
          cat "$RUNNER_TEMP/tau-bench-retail/evotool_treatments_audit.md"
      - name: Run deterministic real-tool EvoTool episode smoke (Train only)
        run: |
          python scripts/run_evotool_real_tool_episode_smoke.py \
            --dataset-dir "$RUNNER_TEMP/tau-bench-retail" \
            --output "$RUNNER_TEMP/tau-bench-retail/evotool_real_episode_smoke.json"
      - name: Run pinned dataset, conformance, and treatment tests
        env:
          TAU_BENCH_AUDIT_OUTPUT: ${{ runner.temp }}/tau-bench-retail
          EVOTOOL_TREATMENT_AUDIT_OUTPUT: ${{ runner.temp }}/tau-bench-retail
        run: |
          python -m pytest -q \
            tests/test_tau_bench_retail_dataset.py \
            tests/test_evotool_tau_bench_conformance.py \
            tests/test_evotool_treatments.py \
            tests/test_evotool_episode_integration.py \
            tests/test_d080_fault_injection.py
      - name: Upload normalized dataset and integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-bench-legacy-retail-${{ github.sha }}
          path: ${{ runner.temp }}/tau-bench-retail/
          if-no-files-found: error
          retention-days: 30

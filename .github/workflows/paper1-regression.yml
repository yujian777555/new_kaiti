name: Paper 1 simulator regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pilot-a3b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run transferred simulator and evolutionary-controller tests
        working-directory: experiments/pilot_a3b
        run: |
          python -m pytest -q \
            test_a3_labels.py \
            test_d079_diagnostics.py \
            test_d079_manifest_lock.py \
            test_formal_scenario_generator.py \
            test_recoverability.py \
            test_sbcg.py \
            test_sbcg_runner.py \
            test_task_semantics.py

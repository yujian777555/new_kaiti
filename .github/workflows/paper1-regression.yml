name: Paper 1 simulator regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pilot-a3b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run transferred simulator and evolutionary-controller tests
        working-directory: experiments/pilot_a3b
        run: |
          python -m pytest -q \
            test_a3_labels.py \
            test_d079_diagnostics.py \
            test_d079_manifest_lock.py \
            test_formal_scenario_generator.py \
            test_recoverability.py \
            test_sbcg.py \
            test_sbcg_runner.py \
            test_task_semantics.py
      - name: Build split-preserving legacy tau-bench Retail dataset
        run: |
          python scripts/prepare_tau_bench_retail.py --output-dir "$RUNNER_TEMP/tau-bench-retail" || true
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "tau-bench-retail", "integrity_report.json")
          report = json.load(open(path, encoding="utf-8"))
          gold = report["gold_action_audit"]
          print(json.dumps({
              "gate": report["gate"],
              "source_integrity_gate": report["source_integrity_gate"],
              "gold_action_gate": report["gold_action_gate"],
              "splits": {k: v["task_count"] for k, v in report["splits"].items()},
              "domain_error_count": gold["domain_error_count"],
              "domain_error_task_count": gold["domain_error_task_count"],
              "domain_error_counts_by_split": gold["domain_error_counts_by_split"],
              "domain_error_counts_by_tool": gold["domain_error_counts_by_tool"],
              "domain_error_counts_by_message": gold["domain_error_counts_by_message"],
              "domain_error_examples": gold["domain_errors"],
              "invocation_errors": gold["invocation_errors"],
              "signature_errors": gold["signature_errors"],
              "failures": report["failures"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Run pinned legacy tau-bench Retail dataset tests
        env:
          TAU_BENCH_AUDIT_OUTPUT: ${{ runner.temp }}/tau-bench-retail
        run: python -m pytest -q tests/test_tau_bench_retail_dataset.py
      - name: Upload normalized dataset and integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-bench-legacy-retail-${{ github.sha }}
          path: ${{ runner.temp }}/tau-bench-retail/
          if-no-files-found: error
          retention-days: 30
